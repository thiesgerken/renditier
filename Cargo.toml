[package]
name = "stockdb"
version = "0.1.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "stockdb"

[dependencies]
argonautica = "0.2"
base64 = "0.13"
chrono = { version = "0.4", features = ["serde"] }
clap = "2.33"
config = "0.10"
csv = "1.1"
diesel = { version = "1.4", features = ["postgres", "chrono", "r2d2"] }
diesel_migrations = "1.4"
futures = "0.3"
itertools = "0.9"
log = "0.4"
lopdf = "0.26"
# pdf-extract = "0.6"
pdf-extract = { git = "https://github.com/thiesgerken/pdf-extract" }
prettytable-rs = "0.8"
qstring = "0.7"
regex = "1.4"
reqwest = "0.10"
rocket = { git = "https://github.com/SergioBenitez/Rocket", rev = "1f1f44f336e5a172361fc1860461bb03667b1ed2", features=["secrets"] }
rocket_contrib = { git = "https://github.com/SergioBenitez/Rocket",  rev = "1f1f44f336e5a172361fc1860461bb03667b1ed2", features = ["diesel_postgres_pool"] }
# rocket = "0.4"
# rocket_contrib = { version = "0.4", features = ["diesel_postgres_pool"] }
rust-embed = "5.6"
scraper = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.8"
tokio = { version = "0.2.23", features= ["full"] } # needs to be synced to the version rocket and reqwest use!
toml = "0.5"
web-push = "0.7"

[dev-dependencies]
criterion = "0.3"

[profile.release]
lto = true

[[bench]]
name = "analysis"
harness = false
