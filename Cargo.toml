[package]
name = "stockdb"
version = "0.1.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "stockdb"

[dependencies]
argonautica = "0.2"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["cargo"] }
clap_complete = "4.5"
config = "0.15"
diesel = { version = "2.2", features = ["postgres", "chrono", "r2d2"] }
diesel_migrations = "2.2"
futures = "0.3"
itertools = "0.15"
log = "0.4"
pdf-extract = "0.12.0"
prettytable-rs = "0.10"
qstring = "0.7"
regex = "1.4"
reqwest = "0.13.4"
rocket = { version = "0.5.1", features = ["secrets", "json"] }
rocket_sync_db_pools = { version = "0.1.0", features = [
    "diesel_postgres_pool",
] }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
simplelog = "0.12"
time = "0.3.37"
tokio = { version = "1.2", features = [
    "full",
] } # needs to be synced to the version rocket and reqwest use!
toml = "1.1.2"
web-push = "0.11"

[profile.release]
lto = true

[dev-dependencies]
test-log = "0.2.16"
