[package]
name = "stockdb"
version = "0.1.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "stockdb"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
qstring = "0.7"
reqwest = {version ="0.10.2", features = ["blocking"] }
scraper = "0.11"
csv = "1.1"
diesel = { version = "1.4", features = ["postgres", "chrono"] }
diesel_migrations = "1.4"
rocket =   "0.4" 
rocket_contrib = { version = "0.4", features = ["diesel_postgres_pool"] }
dotenv = "0.15"
log = "0.4"
clap = "2.33"
config = "0.10"
simplelog = "0.7"
argonautica = "0.2"
prettytable-rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
rust-embed = "5.3.0"
rayon = "1.3.0"

[dev-dependencies]
criterion = "0.3.1"

[profile.release]
# codegen-units = 1
# lto = true

[[bench]]
name = "analysis"
harness = false
