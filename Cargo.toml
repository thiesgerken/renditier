[package]
name = "stockdb"
version = "0.1.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"
default-run = "stockdb"

[dependencies]
argonautica = "0.2"
base64 = "0.13"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "3.0", features = ["cargo"] }
clap_complete = "3.0"
config = "0.11"
csv = "1.1"
diesel = { version = "1.4", features = ["postgres", "chrono", "r2d2"] }
diesel_migrations = "1.4"
futures = "0.3"
itertools = "0.10"
log = "0.4"
lopdf = "0.26"
pdf-extract = "0.6"
prettytable-rs = "0.8"
qstring = "0.7"
regex = "1.4"
reqwest = "0.11"
rocket = { version = "0.5.0-rc.1", features = ["secrets", "json"] }
rocket_sync_db_pools = { version = "0.1.0-rc.1", features = [
    "diesel_postgres_pool",
] }
rust-embed = "6.2"
scraper = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.11"
tokio = { version = "1.2", features = [
    "full",
] } # needs to be synced to the version rocket and reqwest use!
toml = "0.5"
web-push = "0.9"

[dev-dependencies]
test-log = "0.2"
env_logger = "0.9"

[profile.release]
lto = true
