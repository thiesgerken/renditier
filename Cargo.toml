[package]
name = "stocks"
version = "0.1.0"
authors = ["Thies Gerken <thies@thiesgerken.de>"]
edition = "2018"

[dependencies]
chrono = "0.4.9"
qstring = "0.7"
reqwest = "0.9.22"
scraper = "0.11.0"
csv = "1.1.1"
diesel = { version = "1.4.3", features = ["postgres", "chrono"] }
diesel_migrations = "1.4.0"
dotenv = "0.15.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true