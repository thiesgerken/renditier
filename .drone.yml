kind: pipeline
name: default

steps:
  - name: restore-cache-with-filesystem
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      restore: true
      cache_key: "volume"
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "vendor"
        - "/home/.cache"
    volumes:
      - name: cache
        path: /tmp/cache

  - name: build
    image: ubuntu:jammy
    pull: true
    commands:
      - ls vendor || true
      - mkdir -p vendor
      - touch vendor/a.txt
      - ls vendor
      - pwd
      - ls ~/.cache || true
      - touch ~/.cache/b.txt

  - name: rebuild-cache-with-filesystem
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      rebuild: true
      cache_key: "volume"
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "vendor"
        - "/home/.cache"
    volumes:
      - name: cache
        path: /tmp/cache

volumes:
  - name: cache
    host:
      path: /var/lib/cache

trigger:
  ref:
    - refs/heads/main
    # - refs/heads/**
    - refs/pull/*/head
