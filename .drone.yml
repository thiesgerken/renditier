  - name: build-docker-image
    image: plugins/docker
    settings:
      registry: https://git.gerken.haus
      repo: thies/stockdb
      tags:
        - ${DRONE_COMMIT_BRANCH}
      force_tag: true
      username: thies
      password:
        from_secret: gitea_token

volumes:
  - name: cache
    host:
      path: /var/lib/cache

trigger:
  ref:
    - refs/heads/main
    - refs/pull/*/head
