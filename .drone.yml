kind: pipeline
name: default

steps:
  - name: restore-cache-with-filesystem
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      restore: true
      cache_key: "backend"
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "target"
        - "cargo"
    volumes:
      - name: cache
        path: /tmp/cache

  - name: build-backend
    image: rust:1.63
    commands:
      - export CARGO_HOME=$(pwd)/cargo/
      - apt-get update -y && apt-get install -y --no-install-recommends libc-dev libssl-dev pkg-config gcc clang
      - mkdir -p web/build
      - touch web/build/index.html
      - cargo test

  - name: rebuild-cache-with-filesystem
    image: meltwater/drone-cache
    pull: true
    settings:
      backend: "filesystem"
      rebuild: true
      cache_key: "backend"
      archive_format: "tar"
      filesystem_cache_root: "/tmp/cache"
      mount:
        - "target"
        - "cargo"
    volumes:
      - name: cache
        path: /tmp/cache

volumes:
  - name: cache
    host:
      path: /var/lib/cache

trigger:
  ref:
    - refs/heads/main
    - refs/pull/*/head
