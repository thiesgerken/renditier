stages:
  - build-web
  - build-server
  # - package
  # - deploy

build-web: 
  stage: build-web  
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .yarn-cache
      - web/src/semantic
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/web
  script: 
    - cd web && yarn install && yarn run build && yarn run analyze
  before_script:
    - mkdir -p .yarn-registry
    - ln -s $(pwd)/.yarn-cache ~/.yarn-cache
  artifacts:
    expire_in: 1 month
    paths:
      - web/build

.build-server:
  stage: build-server
  dependencies: 
    - build-web
  script:
    - cargo --version
    - cargo build --target=x86_64-unknown-linux-gnu --release
    - cp target/x86_64-unknown-linux-gnu/release/stockdb .
    - strip -s stockdb
  before_script:
    - export LANG=C.UTF-8    
    - rustup update
    - mkdir -p .cargo-registry ~/.cargo
    - ln -s $(pwd)/.cargo-registry ~/.cargo/registry
    - cargo --version
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target
      - .cargo-registry
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb

build-server-arch:
  extends: .build-server
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/server-arch

build-server-ubuntu:
  extends: .build-server
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/server-ubuntu
  
