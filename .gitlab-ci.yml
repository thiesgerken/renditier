stages:
  - build
  # - package
  # - deploy

build:
  stage: build
  script:
    - cargo build --target=x86_64-unknown-linux-gnu --release
    - cp target/x86_64-unknown-linux-gnu/release/stockdb .
    - strip -s stockdb
  before_script:
    - export LANG=C.UTF-8    
    - pacman -Syyuu --noconfirm
    - rustup update
    - mkdir -p .cargo-registry ~/.cargo/registry
    - ln -s $(pwd)/.cargo-registry ~/.cargo/registry
  cache:
    paths:
      - target
      - .cargo-registry
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb

