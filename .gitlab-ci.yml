stages:
  - build-web
  - build-server
  - package
  - deploy

build-web: 
  stage: build-web  
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .yarn-cache
      - web/src/semantic
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/web
  script: 
    - cd web && yarn install && yarn run build && yarn run analyze
  before_script:
    - mkdir -p .yarn-registry
    - ln -s $(pwd)/.yarn-cache ~/.yarn-cache
  artifacts:
    expire_in: 1 month
    paths:
      - web/build

.build-server:
  stage: build-server
  dependencies: 
    - build-web
  script:
    - cargo build --target=x86_64-unknown-linux-gnu --release
    - cp target/x86_64-unknown-linux-gnu/release/stockdb .
    - strip -s stockdb
    - target/x86_64-unknown-linux-gnu/release/generate --config > config-dist.toml
    - target/x86_64-unknown-linux-gnu/release/generate --bash > bash-completions
    - target/x86_64-unknown-linux-gnu/release/generate --zsh > zsh-completions
  before_script:
    - export LANG=C.UTF-8    
    - rustup update
    - mkdir -p .cargo-registry ~/.cargo
    - ln -s $(pwd)/.cargo-registry ~/.cargo/registry
    - cargo --version
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target
      - .cargo-registry
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb
      - config-dist.toml 
      - bash_completions
      - zsh_completions

build-server-arch:
  extends: .build-server
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/server-arch

build-server-ubuntu:
  extends: .build-server
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/server-ubuntu

package-server-ubuntu:
  stage: package
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/package
  dependencies: 
    - build-server-ubuntu
  script:
    - (cd package/ubuntu && ./package.sh)
    - mv package/ubuntu/build/stockdb.deb .
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb.deb

package-server-arch:
  stage: package
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/package
  dependencies: 
    - build-server-arch
  script:
    - (cd package/arch && ./package.sh)
    - mv package/arch/build/stockdb-0.1.0-0-x86_64.pkg.tar.xz .
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb-0.1.0-0-x86_64.pkg.tar.xz

.deploy-thiesgerken-de:
  stage: deploy
  dependencies:
    - package-server-ubuntu
  script:
    - echo "$RSA_THIESGERKEN_DE" > id_rsa
    - chmod 500 id_rsa
    - scp -i id_rsa -oStrictHostKeyChecking=no stockdb.deb thies@thiesgerken.de:~
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo systemctl stop stockdb"
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo dpkg --force-confdef --force-confold -i stockdb.deb && rm stockdb.deb"
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo systemctl enable stockdb && sudo systemctl start stockdb"
    - rm id_rsa
  environment:
    name: thiesgerken.de
    url: https://stocks.thiesgerken.de
  tags:
    - build-tools

deploy-thiesgerken-de:
  extends: .deploy-thiesgerken-de
  only:
    - master

deploy-thiesgerken-de-manual:
  extends: .deploy-thiesgerken-de
  when: manual
  except:
    - master