stages:
  - build-web
  - build-server
  - package
  - deploy

build-web:
  stage: build-web
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .yarn-cache
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/build
  script:
    - cd web
    - yarn install
    - yarn run git && yarn test --all && yarn test:lint:js
    - yarn run build && yarn run analyze
  before_script:
    - mkdir -p .yarn-registry
    - ln -s $(pwd)/.yarn-cache ~/.yarn-cache
  artifacts:
    expire_in: 1 month
    paths:
      - web/build

build-server:
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/build
  stage: build-server
  needs: ["build-web"]
  script:
    - cargo build --target=x86_64-unknown-linux-gnu --release
    - cp target/x86_64-unknown-linux-gnu/release/stockdb .
    - strip -s stockdb
    - target/x86_64-unknown-linux-gnu/release/generate --config > config-dist.toml
    - target/x86_64-unknown-linux-gnu/release/generate --shell bash > bash-completions
    - target/x86_64-unknown-linux-gnu/release/generate --shell zsh > zsh-completions
  before_script:
    - export LANG=C.UTF-8
    - rustup update
    - mkdir -p .cargo-registry ~/.cargo
    - ln -s $(pwd)/.cargo-registry ~/.cargo/registry
    - cargo --version
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .cargo-registry
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb
      - config-dist.toml
      - bash-completions
      - zsh-completions

package-deb:
  stage: package
  needs: ["build-server"]
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/build
  script:
    - (cd package/ubuntu && ./package.sh)
    - mv package/ubuntu/build/stockdb.deb .
  artifacts:
    expire_in: 1 month
    paths:
      - stockdb.deb

.deploy-thiesgerken-de:
  stage: deploy
  needs: ["package-deb"]
  script:
    - echo "$RSA_THIESGERKEN_DE" > id_rsa
    - chmod 500 id_rsa
    - scp -i id_rsa -oStrictHostKeyChecking=no stockdb.deb thies@thiesgerken.de:~
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo systemctl stop stockdb"
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo dpkg --force-confdef --force-confold -i stockdb.deb && rm stockdb.deb"
    - ssh -i id_rsa -oStrictHostKeyChecking=no thies@thiesgerken.de "sudo systemctl enable stockdb && sudo systemctl start stockdb"
    - rm id_rsa
  environment:
    name: thiesgerken.de
    url: https://stocks.thiesgerken.de
  tags:
    - docker
  image: git.thiesgerken.de:5005/thies/stockdb/build

deploy-thiesgerken-de:
  extends: .deploy-thiesgerken-de
  only:
    - master

deploy-thiesgerken-de-manual:
  extends: .deploy-thiesgerken-de
  when: manual
  except:
    - master

deploy-docker:
  stage: deploy
  image: docker:20.10.12
  tags:
    - docker
  needs: ["build-server"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --tag $CI_REGISTRY_IMAGE:latest -f docker/run/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  except:
    - master

deploy-docker-version:
  stage: deploy
  image: docker:20.10.12
  tags:
    - docker
  needs: ["build-server"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - VERSION_MAJOR=$(sed -rn "s/^version = \"([0-9.]+)\.\d+\.\d+\"/\1/p" Cargo.toml)
    - VERSION_MAJOR_MINOR=$(sed -rn "s/^version = \"([0-9.]+)\.\d+\"/\1/p" Cargo.toml)
    - VERSION=$(sed -rn "s/^version = \"([0-9.]+)\"/\1/p" Cargo.toml)
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:stable --tag $CI_REGISTRY_IMAGE:$VERSION --tag $CI_REGISTRY_IMAGE:$VERSION_MAJOR --tag $CI_REGISTRY_IMAGE:$VERSION_MAJOR_MINOR --tag $CI_REGISTRY_IMAGE:stable -f docker/run/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$VERSION_MAJOR
    - docker push $CI_REGISTRY_IMAGE:$VERSION_MAJOR_MINOR
    - docker push $CI_REGISTRY_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE:stable
  only:
   - master
