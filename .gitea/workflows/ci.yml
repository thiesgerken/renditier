name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  check:
    # Runs directly on the runner host, whose Nix store is warm between runs.
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The backend embeds web/build, so the frontend is built before clippy and tests.
      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - name: Test frontend
        working-directory: web
        run: |
          pnpm test:types
          pnpm test:lint:js
          pnpm test

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build-docker:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: thies@thiesgerken.de
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref_name == 'main'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-stockdb
          kubectl config use-context context

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/stockdb -n apps-stockdb
          kubectl rollout status deployment/stockdb -n apps-stockdb --timeout=300s
