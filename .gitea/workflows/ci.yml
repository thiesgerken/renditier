name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            target
            .cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: actions/setup-rust@v1
        with:
          rust-version: "1.63"

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc clang
          mkdir -p web/build
          touch web/build/index.html

      - name: Run tests
        run: cargo test
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache Node dependencies
        uses: actions/cache@v3
        with:
          path: |
            web/node_modules
            web/.yarn
          key: ${{ runner.os }}-node-${{ hashFiles('web/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies and test
        run: |
          cd web
          export YARN_CACHE_FOLDER=$(pwd)/.yarn
          yarn install
          yarn run git && yarn test --all && yarn test:lint:js
          yarn run build && yarn run analyze

  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-to: type=inline
