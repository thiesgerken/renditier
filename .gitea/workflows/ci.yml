name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  check:
    # Runs directly on the runner host, whose Nix store is warm between runs.
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The backend embeds web/build, so the frontend is built before clippy and tests.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test frontend
        working-directory: web
        run: |
          npm run test:types
          npm run test:lint:js
          npm test

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build-docker:
    needs: check
    runs-on: nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Built on PRs too, so a broken image shows up before the merge.
      - name: Build image
        run: nix build .#image

      - name: Smoke-test image (temporary, for PR verification)
        shell: nix shell --inputs-from . nixpkgs#gnutar nixpkgs#jq nixpkgs#gnugrep nixpkgs#docker-client --command bash -eo pipefail {0}
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_GITEA }}
        run: |
          img="$RUNNER_TEMP/img"
          rm -rf "$img" && mkdir -p "$img"
          ./result | tar -x -C "$img"
          config="$img/$(jq -r '.[0].Config' "$img/manifest.json")"
          jq '.config' "$config"
          mapfile -t envs < <(jq -r '.config.Env[]' "$config")
          for layer in $(jq -r '.[0].Layers[]' "$img/manifest.json"); do tar -tf "$img/$layer"; done > "$img/files"
          grep -E 'bin/(stockdb|pdftotext)$|ca-bundle.crt$' "$img/files"
          env -i "${envs[@]}" stockdb --help
          env -i "${envs[@]}" pdftotext -v
          cert=$(printf '%s\n' "${envs[@]}" | sed -n 's/^SSL_CERT_FILE=//p'); grep -q "${cert#/}$" "$img/files" && test -s "$cert" && echo "cert ok: $cert"
          if docker info >/dev/null 2>&1; then
            ref=$(./result | docker load | sed -n 's/^Loaded image: //p')
            docker run --rm "$ref" stockdb --help
            docker image rm "$ref"
          else
            echo "no docker access for this user"
          fi
          # Same skopeo invocation as the push step, but into a local OCI layout instead of the registry.
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          skopeo login --username thies --password-stdin gitea.gerken.haus <<< "$REGISTRY_PASSWORD"
          ./result | skopeo copy docker-archive:/dev/stdin "oci:$img/oci:test"
          du -sh "$img/oci"
          rm -rf "$img"

      - name: Push image
        if: github.event_name == 'push'
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_GITEA }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          skopeo login --username thies --password-stdin gitea.gerken.haus <<< "$REGISTRY_PASSWORD"
          ./result | skopeo copy docker-archive:/dev/stdin docker://gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}

      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth.json"

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref_name == 'main'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-stockdb
          kubectl config use-context context

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/stockdb -n apps-stockdb
          kubectl rollout status deployment/stockdb -n apps-stockdb --timeout=300s
