name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  check:
    # Runs directly on the runner host, whose Nix store is warm between runs.
    runs-on: nix
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The backend embeds web/build, so the frontend is built before clippy and tests.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test frontend
        working-directory: web
        run: |
          npm run test:types
          npm run test:lint:js
          npm test

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    needs: check
    runs-on: nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Built on PRs too, so a broken image shows up before the merge.
      - name: Build image
        run: nix build .#image

      - name: Rootless smoke test (temporary, for PR verification)
        shell: nix shell --inputs-from . nixpkgs#docker-client nixpkgs#openssl nixpkgs#gnugrep nixpkgs#jq --command bash -eo pipefail {0}
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_GITEA }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          tag="smoke-$GITHUB_RUN_ID"
          cleanup() {
            docker rm -f "$tag-app" "$tag-pg" >/dev/null 2>&1 || true
            docker network rm "$tag" >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG" "$RUNNER_TEMP/vapid.pem"
          }
          trap cleanup EXIT
          docker login --username thies --password-stdin gitea.gerken.haus <<< "$REGISTRY_PASSWORD"

          new=$(./result | docker load | sed -n 's/^Loaded image: //p')
          echo "image user: $(docker image inspect -f '{{.Config.User}}' "$new")"
          old=gitea.gerken.haus/thies/stockdb:main
          docker pull -q "$old"

          openssl ecparam -genkey -name prime256v1 -out "$RUNNER_TEMP/vapid.pem"
          chmod 0644 "$RUNNER_TEMP/vapid.pem"
          docker network create "$tag" >/dev/null
          docker run -d --name "$tag-pg" --network "$tag" -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=stocks postgres:18 >/dev/null
          until docker exec "$tag-pg" pg_isready -U postgres -d stocks >/dev/null 2>&1; do sleep 1; done

          secure() {
            docker run --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges \
              --network "$tag" -v "$RUNNER_TEMP/vapid.pem:/etc/stockdb/vapid.pem:ro" \
              -e STOCKDB__DATABASE="postgres://postgres@$tag-pg/stocks" \
              -e STOCKDB__WEB__SECRET_KEY="$(openssl rand -base64 32)" \
              -e STOCKDB__WEB__ADDRESS=0.0.0.0 \
              -e STOCKDB__PUSH__KEY_FILE=/etc/stockdb/vapid.pem "$@"
          }

          for img in "$new" "$old"; do
            echo "=== $img"
            secure --rm "$img" stockdb --help | sed -n 1p
            user="smoke$RANDOM"
            printf 'Smoke Test\nsmoke-password\n' | secure -i --rm "$img" stockdb user --add "$user"
            secure -d --name "$tag-app" -p 127.0.0.1:18383:8383 "$img" stockdb -v serve >/dev/null
            for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:18383/ && break; sleep 1; done
            echo "GET / -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18383/)"
            echo "login -> $(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"user_name\":\"$user\",\"password\":\"smoke-password\"}" http://127.0.0.1:18383/api/user/login)"
            sleep 8
            docker logs "$tag-app" 2>&1 | grep -iE "launch|listening|error|warn|private key|denied|read-only" || true
            echo "app running: $(docker inspect -f '{{.State.Running}}' "$tag-app")"
            docker rm -f "$tag-app" >/dev/null
          done
          docker image rm "$new" >/dev/null

      - name: Push image
        if: github.event_name == 'push'
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_GITEA }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          # The runner host has no /etc/containers/policy.json, and the policy only governs which
          # images skopeo accepts as a source, here our own fresh build.
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy "$@"; }
          skopeo login --username thies --password-stdin gitea.gerken.haus <<< "$REGISTRY_PASSWORD"
          ./result | skopeo copy docker-archive:/dev/stdin docker://gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}

      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth.json"

  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_name == 'main'
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.K8S_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster cluster \
            --server=https://k3s0.gerken.haus:6443 \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials user \
            --token=${{ secrets.K8S_TOKEN }}
          kubectl config set-context context \
            --cluster=cluster \
            --user=user \
            --namespace=apps-stockdb
          kubectl config use-context context

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/stockdb -n apps-stockdb
          kubectl rollout status deployment/stockdb -n apps-stockdb --timeout=300s
