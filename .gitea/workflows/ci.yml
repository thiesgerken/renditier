name: CI

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y --no-install-recommends libssl-dev gcc clang
          mkdir -p web/build
          touch web/build/index.html

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup component add rustfmt
      - run: rustup component add clippy

      - run: cargo check
      - run: cargo test
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo build

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install dependencies and test
        run: |
          cd web
          npx yarn install
          npx yarn run git && yarn test --all && yarn test:lint:js
          npx yarn run build && yarn run analyze

  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.gerken.haus
          username: thies
          password: ${{ secrets.DOCKER_REGISTRY_GITEA }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-from: type=registry,ref=gitea.gerken.haus/thies/stockdb:${{ github.ref_name }}
          cache-to: type=inline
