autoInstallPeers: false
nodeLinker: hoisted
peerDependencyRules:
  allowedVersions:
    '@mui/icons-material': '9'
    '@mui/material': '9'
    '@types/react': '18'
    react: '18'
    react-dom: '18'
    react-dnd: '11'
    eslint-plugin-react-hooks: '7'
allowBuilds:
  core-js: true
  core-js-pure: true
  es5-ext: true
  fsevents: true
onlyBuiltDependencies:
  - core-js
  - core-js-pure
  - es5-ext
  - fsevents
