services:
  stockdb:
    build:
      context: .
    image: gitea.gerken.haus/thies/stockdb:latest
    restart: unless-stopped
    ports:
      - "8484:80"
    environment:
      - STOCKDB__DATABASE=postgres://postgres@postgres/stocks
      - STOCKDB__WEB__SECRET_KEY=WD91xfOSUW8WQwQM3vihMj5+SVNM3ICkCmN6rqHdr8o=
      - STOCKDB__WEB__PORT=80
      - STOCKDB__WEB__ADDRESS=0.0.0.0
      - STOCKDB__WEB__SERVER_KEY=""
      - STOCKDB__PUSH__KEY_FILE=""
    command:
      stockdb -v serve

  postgres:
    image: docker.io/postgres:14@sha256:445df84770a5a99d141a79700f2806313bf9569ffa08a71f055b28702859a981
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=stocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    command:
      postgres -c max_connections=256

volumes:
  postgres:
