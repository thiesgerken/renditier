services:
  stockdb:
    build:
      context: .
    image: gitea.gerken.haus/thies/stockdb:latest
    restart: unless-stopped
    ports:
      - "8484:80"
    environment:
      - STOCKDB__DATABASE=postgres://postgres@postgres/stocks
      - STOCKDB__WEB__SECRET_KEY=WD91xfOSUW8WQwQM3vihMj5+SVNM3ICkCmN6rqHdr8o=
      - STOCKDB__WEB__PORT=80
      - STOCKDB__WEB__ADDRESS=0.0.0.0
      - STOCKDB__WEB__SERVER_KEY=""
      - STOCKDB__PUSH__KEY_FILE=""
    command: stockdb -v serve

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    volumes:
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=stocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    command: postgres -c max_connections=256

volumes:
  postgres18:
