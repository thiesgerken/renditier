version: "3.3"
services:
  stockdb:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8484:80"

  postgres:
    image: docker.io/postgres:14
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=stocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres: