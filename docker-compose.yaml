services:
  renditier:
    image: gitea.gerken.haus/thies/renditier:main
    restart: unless-stopped
    ports:
      - "8484:8383"
    environment:
      - RENDITIER__DATABASE=postgres://postgres@postgres/stocks
      # Demo value for local use only: anyone can decrypt the session cookies with it.
      # Generate a real one with `openssl rand -base64 32`.
      - RENDITIER__WEB__SECRET_KEY=WD91xfOSUW8WQwQM3vihMj5+SVNM3ICkCmN6rqHdr8o=
      - RENDITIER__WEB__ADDRESS=0.0.0.0
      # Optional: the users' time zone, which decides where days, weeks and years begin.
      # Defaults to Europe/Berlin; an unknown zone stops the server at startup.
      - RENDITIER__TIMEZONE=Europe/Berlin
    command: renditier -v serve

  postgres:
    image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    volumes:
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=stocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    command: postgres -c max_connections=256

volumes:
  postgres18:
