services:
  stockdb:
    image: gitea.gerken.haus/thies/stockdb:main
    restart: unless-stopped
    ports:
      - "8484:8383"
    environment:
      - STOCKDB__DATABASE=postgres://postgres@postgres/stocks
      # Demo value for local use only: anyone can decrypt the session cookies with it.
      # Generate a real one with `openssl rand -base64 32`.
      - STOCKDB__WEB__SECRET_KEY=WD91xfOSUW8WQwQM3vihMj5+SVNM3ICkCmN6rqHdr8o=
      - STOCKDB__WEB__ADDRESS=0.0.0.0
    command: stockdb -v serve

  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    volumes:
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=stocks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    command: postgres -c max_connections=256

volumes:
  postgres18:
